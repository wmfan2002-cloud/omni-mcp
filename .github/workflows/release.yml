name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test on Linux
        run: go test ./... -count=1
      - name: Build Linux and Windows release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X omni-mcp/internal/app.Version=$VERSION" -o dist/linux-amd64/omni-mcp ./cmd/omni-mcp
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X omni-mcp/internal/app.Version=$VERSION" -o dist/linux-arm64/omni-mcp ./cmd/omni-mcp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X omni-mcp/internal/app.Version=$VERSION" -o dist/omni-mcp-windows-amd64.exe ./cmd/omni-mcp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui -s -w -X omni-mcp/internal/app.Version=$VERSION" -o dist/omni-mcp-desktop-windows-amd64.exe ./cmd/omni-mcp
          tar -C dist/linux-amd64 -czf dist/omni-mcp-linux-amd64.tar.gz omni-mcp
          tar -C dist/linux-arm64 -czf dist/omni-mcp-linux-arm64.tar.gz omni-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: |
            dist/*.tar.gz
            dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test on native macOS
        run: go test ./cmd/... ./internal/agent/... ./internal/agentui/... ./internal/config/... ./internal/process/... -count=1
      - name: Build and package macOS Desktop .app bundles and CLI archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/darwin-arm64 dist/darwin-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X omni-mcp/internal/app.Version=$VERSION" -o dist/darwin-arm64/omni-mcp ./cmd/omni-mcp
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X omni-mcp/internal/app.Version=$VERSION" -o dist/darwin-amd64/omni-mcp ./cmd/omni-mcp
          bash scripts/package-macos-app.sh dist/darwin-arm64/omni-mcp arm64 "$VERSION" dist/OmniMCP-Desktop-macos-arm64.zip
          bash scripts/package-macos-app.sh dist/darwin-amd64/omni-mcp amd64 "$VERSION" dist/OmniMCP-Desktop-macos-amd64.zip
          tar -C dist/darwin-arm64 -czf dist/omni-mcp-darwin-arm64.tar.gz omni-mcp
          tar -C dist/darwin-amd64 -czf dist/omni-mcp-darwin-amd64.tar.gz omni-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/*.zip
            dist/*.tar.gz

  publish:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Compute checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-dist
          sha256sum *.tar.gz *.exe *.zip > SHA256SUMS
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" *.tar.gz *.exe *.zip SHA256SUMS --generate-notes
