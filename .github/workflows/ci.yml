name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build Linux Hub and Windows Agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/omni-mcp-linux-amd64 ./cmd/omni-mcp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/omni-mcp-windows-amd64.exe ./cmd/omni-mcp

