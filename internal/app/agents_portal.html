<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设备管理中心 · Omni MCP Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet" />
  <script>
    try {
      var t = localStorage.getItem('omni-steep-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #ffffff;
      --surface: #fafafb;
      --surface-band: #f7f7f8;
      --header-bg: rgba(255, 255, 255, 0.82);
      --border: #e7e8ea;
      --border-strong: #d4d6dc;
      --ink: #17191c;
      --text: #17191c;
      --text-secondary: #5e626d;
      --text-muted: #777b86;
      --text-faint: #a3a6af;
      --btn-primary-bg: #17191c;
      --btn-primary-fg: #ffffff;
      --btn-primary-hover: #2d3036;
      --btn-ghost-bg: rgba(23, 25, 28, 0.045);
      --btn-ghost-hover: rgba(23, 25, 28, 0.085);
      --ok: #1f7a4d;
      --ok-dot: #1f9d60;
      --danger: #b42318;
      --danger-bg: rgba(180, 35, 24, 0.08);
      --danger-border: rgba(180, 35, 24, 0.22);
      --hero-glow: radial-gradient(68% 95% at 20% 10%, rgba(211, 227, 252, 0.65) 0%, rgba(211, 227, 252, 0) 64%),
                   radial-gradient(58% 90% at 86% 18%, rgba(251, 225, 209, 0.72) 0%, rgba(251, 225, 209, 0) 62%);
      --pair-glow: linear-gradient(135deg, rgba(211, 227, 252, 0.58) 0%, rgba(251, 225, 209, 0.45) 100%);
      --font-serif: "Newsreader", "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --surface: #1a1a1a;
      --surface-band: #1e1e1e;
      --header-bg: rgba(34, 34, 34, 0.78);
      --border: #252525;
      --border-strong: #343434;
      --ink: #ffffff;
      --text: #e7e7e7;
      --text-secondary: #a0a0a0;
      --text-muted: #898989;
      --text-faint: #6c6c6c;
      --btn-primary-bg: #ffffff;
      --btn-primary-fg: #000000;
      --btn-primary-hover: #e7e7e7;
      --btn-ghost-bg: rgba(255, 255, 255, 0.05);
      --btn-ghost-hover: rgba(255, 255, 255, 0.1);
      --ok: #5cd69a;
      --ok-dot: #34d399;
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.1);
      --danger-border: rgba(248, 113, 113, 0.26);
      --hero-glow: radial-gradient(64% 92% at 50% -10%, rgba(77, 47, 135, 0.34) 0%, rgba(21, 16, 30, 0.45) 48%, rgba(18, 18, 18, 0) 78%);
      --pair-glow: linear-gradient(135deg, rgba(77, 47, 135, 0.24) 0%, rgba(21, 16, 30, 0.55) 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: var(--font-sans); font-size: 14px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .topbar {
      position: sticky; top: 0; z-index: 20; height: 60px;
      background: var(--header-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1040px; height: 100%; margin: 0 auto; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
    .mark {
      width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg);
      display: grid; place-items: center;
    }
    .brand-name { font-size: 14.5px; font-weight: 500; letter-spacing: -0.015em; }
    .brand-sep { color: var(--text-faint); margin: 0 4px; }
    .brand-sub { font-size: 13.5px; color: var(--text-muted); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .user-label { font-size: 12.5px; color: var(--text-muted); padding-right: 4px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 32px; padding: 0 14px; border-radius: 999px; font: 450 13px/1 var(--font-sans);
      border: 1px solid var(--border); background: var(--btn-ghost-bg); color: var(--text);
      cursor: pointer; text-decoration: none; transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .btn:hover { background: var(--btn-ghost-hover); border-color: var(--border-strong); }
    .btn-lg { height: 40px; padding: 0 20px; font-size: 13.5px; }
    .btn-icon { width: 32px; padding: 0; }
    .btn-primary { background: var(--btn-primary-bg); border-color: var(--btn-primary-bg); color: var(--btn-primary-fg); font-weight: 500; }
    .btn-primary:hover { background: var(--btn-primary-hover); border-color: var(--btn-primary-hover); }
    .btn-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .btn-danger:hover, .btn-danger-solid { background: var(--danger); border-color: var(--danger); color: #ffffff; }

    .atmosphere { background: var(--hero-glow); border-bottom: 1px solid var(--border); }
    .hero {
      max-width: 1040px; margin: 0 auto; padding: 38px 28px 30px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    }
    .hero h1 {
      margin: 0 0 8px; font-family: var(--font-serif); font-size: 38px; font-weight: 400;
      line-height: 1.14; letter-spacing: -0.025em; color: var(--ink);
    }
    .hero p { margin: 0; font-size: 14.5px; color: var(--text-secondary); max-width: 560px; }
    .metrics { display: flex; gap: 32px; }
    .metric { text-align: right; }
    .metric-val { font-family: var(--font-serif); font-size: 34px; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
    .metric-lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 28px 64px; }
    .section { margin-bottom: 36px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-family: var(--font-serif); font-size: 24px; font-weight: 400; letter-spacing: -0.02em; color: var(--ink); }
    .section-meta { font-size: 12.5px; color: var(--text-faint); }

    .pair-card {
      background: var(--pair-glow), var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px 28px; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    }
    .pair-left { display: flex; align-items: center; gap: 20px; flex: 1; min-width: 260px; }
    .pair-code-box {
      padding: 12px 18px; border-radius: 14px; background: var(--bg);
      border: 1px solid var(--border); text-align: center; min-width: 148px;
    }
    .pair-code-lbl { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .pair-code { font-size: 20px; font-weight: 500; letter-spacing: 0.1em; color: var(--ink); }
    .pair-info h3 { margin: 0 0 4px; font-family: var(--font-serif); font-size: 24px; font-weight: 400; color: var(--ink); }
    .pair-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 16px; flex-wrap: wrap; }
    .pair-actions { display: flex; align-items: center; gap: 10px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 8px 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-faint); padding: 12px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 16px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13.5px; }
    tr:last-child td { border-bottom: 0; }
    .dev-name { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--ink); }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot.online { background: var(--ok-dot); box-shadow: 0 0 0 4px rgba(31, 157, 96, 0.16); }
    .dot.offline { background: var(--text-faint); opacity: 0.5; }
    .status-text.online { color: var(--ok); font-weight: 500; }
    .status-text.offline { color: var(--text-muted); }
    .sub-line { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
    .cell-path { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }

    .empty { padding: 48px 20px; text-align: center; }
    .empty h3 { margin: 0 0 6px; font-family: var(--font-serif); font-size: 22px; font-weight: 400; color: var(--ink); }
    .empty p { margin: 0 auto; max-width: 480px; font-size: 13.5px; color: var(--text-muted); }

    .notice-bar {
      padding-top: 20px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: 12.5px; color: var(--text-faint); flex-wrap: wrap;
    }

    .toast {
      position: fixed; right: 24px; bottom: 24px; z-index: 50;
      padding: 11px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px;
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { background: var(--danger); color: #ffffff; }
    @media (max-width: 760px) {
      .topbar-inner, .hero, .wrap { padding-left: 16px; padding-right: 16px; }
      .hide-sm { display: none; }
      .hero h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3L3 19h18L12 3z" />
          </svg>
        </span>
        <span class="brand-name">Omni MCP Hub</span>
        <span class="brand-sep">/</span>
        <span class="brand-sub">设备管理</span>
      </a>
      <div class="top-actions">
        <span class="user-label" id="userLabel">__OMNI_PORTAL_USER__</span>
        <button class="btn btn-icon" id="themeBtn" title="切换深浅主题" aria-label="切换主题">
          <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
        <a class="btn" href="/">首页</a>
        <button class="btn" id="logoutBtn" style="display:none;">退出</button>
      </div>
    </div>
  </header>

  <section class="atmosphere">
    <div class="hero">
      <div>
        <h1>已接入设备与一键配对</h1>
        <p>在任意 Windows、macOS 或 Linux 客户端填写自定义设备名并点击连接，即可在此核对验证码一键批准接入，无需 SSH 配置密钥。</p>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-val" id="metricOnline">0</div>
          <div class="metric-lbl">当前在线</div>
        </div>
        <div class="metric">
          <div class="metric-val" id="metricTotal">0</div>
          <div class="metric-lbl">已授权设备</div>
        </div>
      </div>
    </div>
  </section>

  <main class="wrap">
    <section class="section" id="pendingSection" style="display:none;">
      <div class="section-head">
        <div class="section-title">待审批接入请求</div>
        <div class="section-meta">请核对客户端显示的 8 位验证码</div>
      </div>
      <div id="pendingList"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div class="section-title">已授权设备</div>
        <div class="section-meta" id="syncMeta">自动同步中</div>
      </div>
      <div class="panel">
        <div id="devicesContainer"></div>
      </div>
    </section>

    <div class="notice-bar">
      <span>接入流程：打开客户端 → 填写 Hub 地址、自定义设备名并选定工作目录 → 点击「保存并连接」→ 在本页点击「批准接入」。</span>
      <span class="mono">__OMNI_PORTAL_VERSION__</span>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const CSRF_TOKEN = "__OMNI_PORTAL_CSRF__";
    const TARGET_CODE = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
    let confirmRevokeName = "";
    let confirmTimer = null;
    let latestState = null;

    function esc(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function showToast(msg, isErr) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show" + (isErr ? " err" : "");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { el.className = "toast"; }, 3200);
    }

    function fmtRelTime(iso) {
      if (!iso) return "尚未上线";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "—";
      const diff = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function fmtRemain(iso) {
      const ms = new Date(iso).getTime() - Date.now();
      if (isNaN(ms) || ms <= 0) return "即将过期";
      const s = Math.ceil(ms / 1000);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m > 0 ? ("剩余 " + m + " 分 " + r + " 秒") : ("剩余 " + r + " 秒");
    }

    async function apiPost(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Omni-CSRF": CSRF_TOKEN },
        body: JSON.stringify(body || {})
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { location.reload(); return null; }
      if (!res.ok) throw new Error(data.error || ("请求失败 (" + res.status + ")"));
      return data;
    }

    async function approvePair(code) {
      try {
        const state = await apiPost("/agents/api/approve", { code });
        if (state) {
          render(state);
          showToast("已批准接入，客户端将自动完成加密配对并上线");
          if (TARGET_CODE && TARGET_CODE === code) history.replaceState(null, "", "/agents");
        }
      } catch (err) { showToast(err.message, true); }
    }

    async function rejectPair(code) {
      try {
        const state = await apiPost("/agents/api/reject", { code });
        if (state) { render(state); showToast("已拒绝该配对请求"); }
      } catch (err) { showToast(err.message, true); }
    }

    async function revokeDevice(name) {
      if (confirmRevokeName !== name) {
        confirmRevokeName = name;
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(() => { confirmRevokeName = ""; if (latestState) render(latestState); }, 4500);
        if (latestState) render(latestState);
        return;
      }
      confirmRevokeName = "";
      try {
        const state = await apiPost("/agents/api/revoke", { name });
        if (state) { render(state); showToast("已吊销设备 " + name + " 并断开连接"); }
      } catch (err) { showToast(err.message, true); }
    }

    function render(state) {
      latestState = state;
      const pending = state.pending || [];
      const devices = state.devices || [];
      document.getElementById("metricOnline").textContent = String(devices.filter(d => d.online).length);
      document.getElementById("metricTotal").textContent = String(devices.length);
      document.getElementById("logoutBtn").style.display = state.auth_enabled ? "" : "none";
      document.getElementById("syncMeta").textContent = "已同步 · " + new Date().toLocaleTimeString([], { hour12: false });

      const pendingSec = document.getElementById("pendingSection");
      const pendingList = document.getElementById("pendingList");
      if (!pending.length) {
        pendingSec.style.display = "none";
        pendingList.innerHTML = "";
      } else {
        pendingSec.style.display = "";
        const sorted = [...pending].sort((a, b) => (b.code === TARGET_CODE ? 1 : 0) - (a.code === TARGET_CODE ? 1 : 0));
        pendingList.innerHTML = sorted.map(p => `
          <div class="pair-card">
            <div class="pair-left">
              <div class="pair-code-box">
                <div class="pair-code-lbl">配对验证码</div>
                <div class="pair-code mono">${esc(p.code)}</div>
              </div>
              <div class="pair-info">
                <h3>${esc(p.name)}</h3>
                <div class="pair-meta">
                  <span>系统：${esc(p.os || "unknown")}</span>
                  <span>来源 IP：<span class="mono">${esc(p.remote_ip || "—")}</span></span>
                  <span>${esc(fmtRemain(p.expires_at))}</span>
                </div>
              </div>
            </div>
            <div class="pair-actions">
              <button class="btn btn-lg" data-reject="${esc(p.code)}">拒绝</button>
              <button class="btn btn-lg btn-primary" data-approve="${esc(p.code)}">批准接入</button>
            </div>
          </div>
        `).join("");
        pendingList.querySelectorAll("[data-approve]").forEach(btn => btn.onclick = () => approvePair(btn.dataset.approve));
        pendingList.querySelectorAll("[data-reject]").forEach(btn => btn.onclick = () => rejectPair(btn.dataset.reject));
      }

      const container = document.getElementById("devicesContainer");
      if (!devices.length) {
        container.innerHTML = `<div class="empty"><h3>还没有已授权的设备</h3><p>在需要接入的电脑上启动 Omni MCP Agent，填写设备名称并点击连接，配对申请会立即出现在本页面顶部。</p></div>`;
        return;
      }
      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>设备名称</th>
              <th>状态</th>
              <th class="hide-sm">平台与能力</th>
              <th class="hide-sm">工作区</th>
              <th class="hide-sm">授权方式</th>
              <th style="text-align:right;">操作</th>
            </tr>
          </thead>
          <tbody>
            ${devices.map(d => {
              const isConfirm = confirmRevokeName === d.name;
              const cap = d.online ? ((d.os || "—") + " · " + (d.allow_exec ? "文件 + 命令执行" : "仅文件读写")) : (d.os || "—");
              const src = d.source === "hub" ? ("Hub 配对" + (d.approved_by ? (" · " + d.approved_by) : "")) : "静态环境变量";
              const action = d.source === "hub"
                ? `<button class="btn ${isConfirm ? "btn-danger-solid" : "btn-danger"}" data-revoke="${esc(d.name)}">${isConfirm ? "确认吊销？" : "吊销并断开"}</button>`
                : `<span class="sub-line">agent.env</span>`;
              return `
                <tr>
                  <td><div class="dev-name"><span class="dot ${d.online ? "online" : "offline"}"></span><span class="mono">${esc(d.name)}</span></div></td>
                  <td><div class="status-text ${d.online ? "online" : "offline"}">${d.online ? "在线" : "离线"}</div><div class="sub-line">${d.online ? "实时已连接" : esc(fmtRelTime(d.last_seen_at))}</div></td>
                  <td class="hide-sm">${esc(cap)}</td>
                  <td class="hide-sm"><div class="cell-path mono" title="${esc(d.workdir || "")}">${esc(d.workdir || "—")}</div></td>
                  <td class="hide-sm">${esc(src)}</td>
                  <td style="text-align:right;">${action}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      `;
      container.querySelectorAll("[data-revoke]").forEach(btn => btn.onclick = () => revokeDevice(btn.dataset.revoke));
    }

    async function fetchState() {
      try {
        const res = await fetch("/agents/api/state", { cache: "no-store" });
        if (res.status === 401) { location.reload(); return; }
        if (!res.ok) return;
        render(await res.json());
      } catch (e) {}
    }

    function applyThemeIcon() {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.getElementById("themeIcon").innerHTML = dark
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'
        : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
    }

    document.getElementById("themeBtn").onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("omni-steep-theme", next); } catch (e) {}
      applyThemeIcon();
    };
    document.getElementById("logoutBtn").onclick = async () => {
      try { await apiPost("/agents/logout", {}); location.reload(); } catch (err) { showToast(err.message, true); }
    };

    applyThemeIcon();
    fetchState();
    setInterval(fetchState, 2500);
  </script>
</body>
