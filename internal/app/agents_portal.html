<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备管理中心 · Omni MCP Hub</title>
<script>
try {
  var t = localStorage.getItem('omni-theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<style>
:root, [data-theme="dark"] {
  --bg: #090b0f;
  --surface: #0e1117;
  --surface-elev: #131720;
  --surface-hover: rgba(255,255,255,0.035);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --text: #eef1f6;
  --text-secondary: #a1aab8;
  --text-muted: #6c7687;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-soft: rgba(59,130,246,0.14);
  --accent-border: rgba(59,130,246,0.34);
  --ok: #10b981;
  --ok-soft: rgba(16,185,129,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --danger-soft: rgba(239,68,68,0.12);
}
[data-theme="light"] {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-elev: #f8fafc;
  --surface-hover: rgba(15,23,42,0.03);
  --border: rgba(15,23,42,0.09);
  --border-strong: rgba(15,23,42,0.16);
  --text: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: rgba(37,99,235,0.1);
  --accent-border: rgba(37,99,235,0.3);
  --ok: #059669;
  --ok-soft: rgba(5,150,105,0.1);
  --warn: #d97706;
  --warn-soft: rgba(217,119,6,0.1);
  --danger: #dc2626;
  --danger-hover: #b91c1c;
  --danger-soft: rgba(220,38,38,0.09);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.topbar {
  position: sticky; top: 0; z-index: 20; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.mark {
  width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff;
  display: grid; place-items: center;
}
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.brand-sep { color: var(--text-muted); margin: 0 6px; }
.brand-sub { font-size: 13px; color: var(--text-secondary); }
.top-actions { display: flex; align-items: center; gap: 10px; }
.user-label { font-size: 12px; color: var(--text-muted); padding-right: 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 7px; font: 500 13px/1 inherit;
  border: 1px solid var(--border-strong); background: var(--surface-elev); color: var(--text);
  cursor: pointer; text-decoration: none; transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover { background: var(--surface-hover); border-color: var(--text-muted); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger {
  background: transparent; border-color: rgba(239,68,68,0.34); color: var(--danger);
}
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-danger-solid {
  background: var(--danger); border-color: var(--danger); color: #fff;
}
.btn-danger-solid:hover { background: var(--danger-hover); }
.btn-icon { width: 32px; padding: 0; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 24px 64px; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  margin-bottom: 24px; flex-wrap: wrap;
}
.page-head h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.page-head p { margin: 0; font-size: 13px; color: var(--text-secondary); }
.metrics {
  display: flex; gap: 20px; align-items: center;
}
.metric { text-align: right; }
.metric-val { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.metric-lbl { font-size: 12px; color: var(--text-muted); }

.section { margin-bottom: 28px; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.02em; }
.section-meta { font-size: 12px; color: var(--text-muted); }

.pair-card {
  background: var(--surface); border: 1px solid var(--accent-border);
  border-radius: 12px; padding: 20px 22px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  box-shadow: 0 0 0 1px var(--accent-soft);
}
.pair-card.highlight {
  background: linear-gradient(180deg, var(--accent-soft), transparent 65%), var(--surface);
}
.pair-left { display: flex; align-items: center; gap: 18px; min-width: 0; flex: 1; }
.pair-code-box {
  padding: 10px 14px; border-radius: 8px; background: var(--surface-elev);
  border: 1px solid var(--border-strong); text-align: center; min-width: 132px;
}
.pair-code-lbl { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.pair-code { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; color: var(--text); }
.pair-info h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pair-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 14px; flex-wrap: wrap; }
.pair-actions { display: flex; align-items: center; gap: 8px; }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 12px; font-weight: 500; color: var(--text-muted);
  padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--surface-elev);
}
td {
  padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px;
}
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-hover); }
.dev-name { display: flex; align-items: center; gap: 9px; font-weight: 600; color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.online { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.offline { background: var(--text-muted); opacity: 0.45; }
.status-text { font-size: 12px; font-weight: 500; }
.status-text.online { color: var(--ok); }
.status-text.offline { color: var(--text-muted); }
.sub-line { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.cell-path { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }

.empty {
  padding: 40px 24px; text-align: center; color: var(--text-secondary);
}
.empty h3 { margin: 0 0 6px; font-size: 15px; color: var(--text); }
.empty p { margin: 0 auto; max-width: 480px; font-size: 13px; color: var(--text-muted); }

.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 50;
  padding: 10px 14px; border-radius: 8px; background: var(--surface-elev);
  border: 1px solid var(--border-strong); color: var(--text); font-size: 13px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.35); opacity: 0; transform: translateY(8px);
  pointer-events: none; transition: opacity 0.18s, transform 0.18s;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.err { border-color: rgba(239,68,68,0.45); color: var(--danger); }

.notice-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--border); font-size: 12px; color: var(--text-secondary);
}
@media (max-width: 760px) {
  .wrap { padding: 20px 14px 48px; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </span>
    <span class="brand-name">Omni MCP Hub</span>
    <span class="brand-sep">/</span>
    <span class="brand-sub">设备管理中心</span>
  </a>
  <div class="top-actions">
    <span class="user-label" id="userLabel">__OMNI_PORTAL_USER__</span>
    <button class="btn btn-icon" id="themeBtn" title="切换浅色/深色主题" aria-label="切换主题">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
    <a class="btn" href="/">首页</a>
    <button class="btn" id="logoutBtn" style="display:none;">退出</button>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1>已接入设备与一键配对</h1>
      <p>在任意 Windows / macOS / Linux 设备填写自定义名称并点击连接，即可在此一键批准接入，无需 SSH 配置密钥。</p>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-val" id="metricOnline">0</div>
        <div class="metric-lbl">当前在线</div>
      </div>
      <div class="metric">
        <div class="metric-val" id="metricTotal">0</div>
        <div class="metric-lbl">已授权设备</div>
      </div>
    </div>
  </div>

  <section class="section" id="pendingSection" style="display:none;">
    <div class="section-head">
      <div class="section-title">待审批接入请求</div>
      <div class="section-meta">请核对设备客户端显示的 8 位验证码</div>
    </div>
    <div id="pendingList"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-title">已授权设备列表</div>
      <div class="section-meta" id="syncMeta">自动同步中</div>
    </div>
    <div class="panel">
      <div id="devicesContainer"></div>
    </div>
  </section>

  <div class="notice-bar">
    <span>新设备接入流程：打开客户端 → 填写 Hub 地址、自定义设备名并选择工作目录 → 点击「连接 Hub」→ 在本页点击「批准接入」。</span>
    <span class="mono">__OMNI_PORTAL_VERSION__</span>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CSRF_TOKEN = "__OMNI_PORTAL_CSRF__";
const TARGET_CODE = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
let confirmRevokeName = "";
let confirmTimer = null;
let latestState = null;

function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function showToast(msg, isErr) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.className = "toast"; }, 3200);
}

function fmtRelTime(iso) {
  if (!iso) return "尚未上线";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  const diff = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function fmtRemain(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (isNaN(ms) || ms <= 0) return "即将过期";
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m > 0 ? ("剩余 " + m + " 分 " + r + " 秒") : ("剩余 " + r + " 秒");
}

async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Omni-CSRF": CSRF_TOKEN },
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    location.reload();
    return null;
  }
  if (!res.ok) throw new Error(data.error || ("请求失败 (" + res.status + ")"));
  return data;
}

async function approvePair(code) {
  try {
    const state = await apiPost("/agents/api/approve", { code });
    if (state) {
      render(state);
      showToast("已批准设备接入，客户端将自动完成加密配对并上线");
      if (TARGET_CODE && TARGET_CODE === code) {
        history.replaceState(null, "", "/agents");
      }
    }
  } catch (err) {
    showToast(err.message, true);
  }
}

async function rejectPair(code) {
  try {
    const state = await apiPost("/agents/api/reject", { code });
    if (state) {
      render(state);
      showToast("已拒绝该配对请求");
    }
  } catch (err) {
    showToast(err.message, true);
  }
}

async function revokeDevice(name) {
  if (confirmRevokeName !== name) {
    confirmRevokeName = name;
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => {
      confirmRevokeName = "";
      if (latestState) render(latestState);
    }, 4500);
    if (latestState) render(latestState);
    return;
  }
  confirmRevokeName = "";
  try {
    const state = await apiPost("/agents/api/revoke", { name });
    if (state) {
      render(state);
      showToast("已吊销设备 " + name + " 并断开连接");
    }
  } catch (err) {
    showToast(err.message, true);
  }
}

function render(state) {
  latestState = state;
  const pending = state.pending || [];
  const devices = state.devices || [];
  const onlineCount = devices.filter(d => d.online).length;
  document.getElementById("metricOnline").textContent = String(onlineCount);
  document.getElementById("metricTotal").textContent = String(devices.length);
  document.getElementById("logoutBtn").style.display = state.auth_enabled ? "" : "none";
  document.getElementById("syncMeta").textContent = "已同步 · " + new Date().toLocaleTimeString([], { hour12: false });

  const pendingSec = document.getElementById("pendingSection");
  const pendingList = document.getElementById("pendingList");
  if (pending.length === 0) {
    pendingSec.style.display = "none";
    pendingList.innerHTML = "";
  } else {
    pendingSec.style.display = "";
    const sorted = [...pending].sort((a, b) => (b.code === TARGET_CODE ? 1 : 0) - (a.code === TARGET_CODE ? 1 : 0));
    pendingList.innerHTML = sorted.map(p => {
      const isTarget = TARGET_CODE && p.code === TARGET_CODE;
      return `
        <div class="pair-card${isTarget ? " highlight" : ""}">
          <div class="pair-left">
            <div class="pair-code-box">
              <div class="pair-code-lbl">配对验证码</div>
              <div class="pair-code mono">${esc(p.code)}</div>
            </div>
            <div class="pair-info">
              <h3>${esc(p.name)}</h3>
              <div class="pair-meta">
                <span>系统：${esc(p.os || "unknown")}</span>
                <span>来源 IP：<span class="mono">${esc(p.remote_ip || "—")}</span></span>
                <span>${esc(fmtRemain(p.expires_at))}</span>
              </div>
            </div>
          </div>
          <div class="pair-actions">
            <button class="btn" data-reject="${esc(p.code)}">拒绝</button>
            <button class="btn btn-primary" data-approve="${esc(p.code)}">批准接入</button>
          </div>
        </div>
      `;
    }).join("");
    pendingList.querySelectorAll("[data-approve]").forEach(btn => {
      btn.addEventListener("click", () => approvePair(btn.getAttribute("data-approve")));
    });
    pendingList.querySelectorAll("[data-reject]").forEach(btn => {
      btn.addEventListener("click", () => rejectPair(btn.getAttribute("data-reject")));
    });
  }

  const container = document.getElementById("devicesContainer");
  if (devices.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <h3>还没有已授权的设备</h3>
        <p>在需要接入的 Windows / macOS / Linux 电脑上启动 Omni MCP Agent，填写自定义设备名称后点击连接，配对申请会立即出现在本页面顶部。</p>
      </div>
    `;
    return;
  }
  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>设备名称</th>
          <th>连接状态</th>
          <th class="hide-sm">平台与能力</th>
          <th class="hide-sm">工作区</th>
          <th class="hide-sm">授权方式</th>
          <th style="text-align:right;">操作</th>
        </tr>
      </thead>
      <tbody>
        ${devices.map(d => {
          const isConfirm = confirmRevokeName === d.name;
          const cap = d.online
            ? ((d.os || "—") + " · " + (d.allow_exec ? "文件 + 命令执行" : "仅文件读写"))
            : (d.os || "—");
          const src = d.source === "hub"
            ? ("Hub 配对" + (d.approved_by ? (" · " + d.approved_by) : ""))
            : "环境变量静态密钥";
          const action = d.source === "hub"
            ? `<button class="btn ${isConfirm ? "btn-danger-solid" : "btn-danger"}" data-revoke="${esc(d.name)}">${isConfirm ? "确认吊销？" : "吊销并断开"}</button>`
            : `<span class="sub-line">agent.env 管理</span>`;
          return `
            <tr>
              <td>
                <div class="dev-name">
                  <span class="dot ${d.online ? "online" : "offline"}"></span>
                  <span class="mono">${esc(d.name)}</span>
                </div>
              </td>
              <td>
                <div class="status-text ${d.online ? "online" : "offline"}">${d.online ? "在线" : "离线"}</div>
                <div class="sub-line">${d.online ? "实时已连接" : esc(fmtRelTime(d.last_seen_at))}</div>
              </td>
              <td class="hide-sm">${esc(cap)}</td>
              <td class="hide-sm"><div class="cell-path mono" title="${esc(d.workdir || "")}">${esc(d.workdir || "—")}</div></td>
              <td class="hide-sm">${esc(src)}</td>
              <td style="text-align:right;">${action}</td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
  container.querySelectorAll("[data-revoke]").forEach(btn => {
    btn.addEventListener("click", () => revokeDevice(btn.getAttribute("data-revoke")));
  });
}

async function fetchState() {
  try {
    const res = await fetch("/agents/api/state", { cache: "no-store" });
    if (res.status === 401) {
      location.reload();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    render(data);
  } catch (e) {}
}

function applyThemeIcon() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.getElementById("themeIcon").innerHTML = isLight
    ? '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
}

document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", cur);
  try { localStorage.setItem("omni-theme", cur); } catch (e) {}
  applyThemeIcon();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await apiPost("/agents/logout", {});
    location.reload();
  } catch (err) {
    showToast(err.message, true);
  }
});

applyThemeIcon();
fetchState();
setInterval(fetchState, 2500);
</script>
</body>
</html>
