# Omni MCP 极简网关容器部署（无 bash / 无 sudo / 无开发套件）。
# 适用场景：fleet.expose_local: false，仅作为远端机群的 MCP 控制面网关。
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env
#   cp ../configs/config.example.yaml config.yaml && $EDITOR config.yaml
#   docker compose -f docker-compose.gateway.yml up -d --build

name: omni-mcp

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
      args:
        VERSION: ${VERSION:-0.1.0}
        AGENT_UID: ${AGENT_UID:-10001}
        AGENT_GID: ${AGENT_GID:-10001}
    image: omni-mcp:${VERSION:-gateway}
    container_name: omni-mcp
    hostname: mcp
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8485}:8484"
    environment:
      OMNI_BASE_URL: ${OMNI_BASE_URL:?请在 deploy/.env 里填 OMNI_BASE_URL，例如 https://omni-mcp.example.com}
      OMNI_LOG_LEVEL: ${OMNI_LOG_LEVEL:-info}
      OMNI_LOG_FORMAT: ${OMNI_LOG_FORMAT:-json}
      TZ: ${TZ:-Asia/Shanghai}

    env_file:
      - .env
    volumes:
      - ./config.yaml:/etc/omni-mcp/config.yaml:ro
      - ./ssh:/home/agent/.ssh:ro
      - mcp-data:/var/lib/omni-mcp
    networks:
      - default
      - ingress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${MEM_LIMIT:-256m}
    memswap_limit: ${MEM_LIMIT:-256m}
    pids_limit: 512
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mcp-data:

networks:
  default:
    name: omni-mcp-internal
  ingress:
    external: true
    name: ${INGRESS_NETWORK:-cloudflared}
